const CartCtx = React.createContext(null);

function CartProvider({ children }) {
  const [items, setItems] = React.useState([]);
  const [isOpen, setIsOpen] = React.useState(false);

  const addItem = React.useCallback((item) => {
    setItems(prev => {
      if (item.alwaysNew) {
        return [...prev, { ...item, id: Date.now() + Math.random(), qty: 1 }];
      }
      const idx = prev.findIndex(p =>
        p.name === item.name &&
        (p.size || '') === (item.size || '') &&
        (p.note || '') === (item.note || '')
      );
      if (idx >= 0) {
        const updated = [...prev];
        updated[idx] = { ...updated[idx], qty: updated[idx].qty + 1 };
        return updated;
      }
      return [...prev, { ...item, id: Date.now() + Math.random(), qty: 1 }];
    });
  }, []);

  const removeItem = React.useCallback((id) => setItems(prev => prev.filter(p => p.id !== id)), []);
  const updateQty  = React.useCallback((id, delta) => setItems(prev => prev.map(p => p.id === id ? { ...p, qty: Math.max(0, p.qty + delta) } : p).filter(p => p.qty > 0)), []);
  const clearCart  = React.useCallback(() => setItems([]), []);

  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  const count = items.reduce((s, i) => s + i.qty, 0);

  return (
    <CartCtx.Provider value={{ items, addItem, removeItem, updateQty, clearCart, total, count, isOpen, setIsOpen }}>
      {children}
    </CartCtx.Provider>
  );
}

// ─── ADD TO CART MODAL ───────────────────────────────────────────────────────
function AddToCartModal({ item, isDual, onClose }) {
  const { addItem } = useCart();
  const [size, setSize] = React.useState('normal');
  const [note, setNote] = React.useState('');
  const [qty,  setQty]  = React.useState(1);
  const price = isDual ? (size === 'normal' ? item.priceNormal : item.priceXL) : item.price;

  const confirm = () => {
    for (let i = 0; i < qty; i++) {
      addItem({ name:item.name, desc:item.desc, price, size: isDual ? size : undefined, note: note.trim() || undefined });
    }
    onClose();
  };

  return (
    <div style={{ position:'fixed', inset:0, zIndex:500, display:'flex', alignItems:'flex-end', justifyContent:'center' }}
         onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.5)', backdropFilter:'blur(4px)' }}></div>
      <div style={{ position:'relative', zIndex:1, width:'100%', maxWidth:'var(--max)', background:'var(--card)', borderRadius:'var(--radius) var(--radius) 0 0', padding:'24px 20px 36px', animation:'slideUp .3s ease', boxShadow:'0 -8px 40px rgba(0,0,0,0.3)' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:18 }}>
          <div style={{ width:36, height:4, borderRadius:2, background:'var(--border)' }}></div>
          <button onClick={onClose} style={{ width:32, height:32, borderRadius:'50%', border:'none', background:'var(--bg2)', cursor:'pointer', fontSize:18, color:'var(--text-muted)', display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>
        </div>

        <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:24, color:'var(--text)', marginBottom:4 }}>{item.name}</div>
        {item.desc && <div style={{ fontSize:13, color:'var(--text-muted)', marginBottom:16 }}>{item.desc}</div>}

        {isDual && (
          <div style={{ marginBottom:16 }}>
            <div style={{ fontSize:12, fontWeight:700, color:'var(--text-muted)', letterSpacing:1, textTransform:'uppercase', marginBottom:8 }}>Tamaño</div>
            <div style={{ display:'flex', gap:8 }}>
              {[['normal', item.priceNormal], ['xl', item.priceXL]].map(([s, p]) => (
                <button key={s} onClick={() => setSize(s)} style={{ flex:1, padding:'10px', borderRadius:999, border:`2px solid ${size === s ? 'var(--orange)' : 'var(--border)'}`, background: size === s ? 'rgba(242,100,25,0.1)' : 'transparent', cursor:'pointer', transition:'all .2s', display:'flex', flexDirection:'column', alignItems:'center', gap:2 }}>
                  <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:15, color: size === s ? 'var(--orange)' : 'var(--text)', textTransform:'uppercase' }}>{s === 'xl' ? 'XL' : 'Normal'}</span>
                  <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:17, color:'var(--yellow)' }}>{fmt(p)}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        <div style={{ marginBottom:20 }}>
          <div style={{ fontSize:12, fontWeight:700, color:'var(--text-muted)', letterSpacing:1, textTransform:'uppercase', marginBottom:8 }}>Nota (opcional)</div>
          <input value={note} onChange={e => setNote(e.target.value)} placeholder="Ej: sin cebolla, extra palta..." style={{ width:'100%', padding:'10px 14px', borderRadius:'var(--radius-sm)', border:'1px solid var(--border)', background:'var(--bg2)', color:'var(--text)', fontSize:14, fontFamily:'Barlow,sans-serif', outline:'none' }} />
        </div>

        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
          <div style={{ display:'flex', alignItems:'center', border:'1px solid var(--border)', borderRadius:999, overflow:'hidden' }}>
            <button onClick={() => setQty(q => Math.max(1, q - 1))} style={{ width:40, height:40, border:'none', background:'var(--bg2)', cursor:'pointer', fontSize:18, color:'var(--text)', display:'flex', alignItems:'center', justifyContent:'center' }}>−</button>
            <span style={{ padding:'0 16px', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:20, color:'var(--text)', minWidth:36, textAlign:'center' }}>{qty}</span>
            <button onClick={() => setQty(q => q + 1)} style={{ width:40, height:40, border:'none', background:'var(--bg2)', cursor:'pointer', fontSize:18, color:'var(--orange)', display:'flex', alignItems:'center', justifyContent:'center' }}>+</button>
          </div>
          <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:26, color:'var(--yellow)' }}>{fmt(price * qty)}</div>
        </div>

        <button onClick={confirm} style={{ width:'100%', padding:'14px', borderRadius:999, border:'none', background:'var(--orange)', color:'#fff', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:20, cursor:'pointer' }}>
          Agregar al carrito
        </button>
      </div>
    </div>
  );
}

  const [relleno,  setRelleno]  = React.useState(null);
  const [proteina, setProteina] = React.useState(null);
  const [size,     setSize]     = React.useState('normal');
  const [toppings, setToppings] = React.useState([]);
  const [salsas,   setSalsas]   = React.useState([]);
  const [note,     setNote]     = React.useState('');
  const [done,     setDone]     = React.useState(false);

  const steps = ['Formato','Relleno','Proteína','Toppings','Salsas'];
  const toggleArr = (arr, setArr, val, max) => {
    if (arr.includes(val)) setArr(arr.filter(x => x !== val));
    else if (arr.length < max) setArr([...arr, val]);
  };
  const canNext = [format !== null, relleno !== null, proteina !== null, true, true];
  const price = proteina ? (size === 'normal' ? proteina.normal : proteina.xl) : 0;

  const addToCart = () => {
    const desc = [
      `${format === 'bowl' ? 'Bowl' : 'Burrito'} · ${relleno}`,
      `${proteina.name} (${size.toUpperCase()})`,
      toppings.length ? `Toppings: ${toppings.join(', ')}` : null,
      salsas.length   ? `Salsas: ${salsas.join(', ')}`     : null,
    ].filter(Boolean).join(' · ');

    addItem({ name:`Burrito Gustoso${format === 'bowl' ? ' (Bowl)' : ''}`, desc, price, note: note.trim() || undefined, alwaysNew:true });
    setIsOpen(true);
    setStep(0); setFormat(null); setRelleno(null); setProteina(null);
    setSize('normal'); setToppings([]); setSalsas([]); setNote(''); setDone(false);
  };

  if (done) return (
    <div style={{ textAlign:'center', padding:'24px 0' }}>
      <div style={{ fontSize:40, marginBottom:10 }}>🌯</div>
      <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:26, color:'var(--orange)', marginBottom:6 }}>¡Listo tu burrito!</div>
      <div style={{ background:'var(--bg2)', border:'1px solid var(--border)', borderRadius:'var(--radius)', padding:'16px', textAlign:'left', marginBottom:16 }}>
        {[['Formato',format==='bowl'?'Bowl':'Burrito'],['Relleno',relleno],['Proteína',`${proteina?.name} (${size.toUpperCase()})`],['Toppings',toppings.join(', ')||'—'],['Salsas',salsas.join(', ')||'—']].map(([k,v]) => (
          <div key={k} style={{ fontSize:13, color:'var(--text-muted)', marginBottom:4 }}><span style={{ fontWeight:700 }}>{k}:</span> {v}</div>
        ))}
      </div>
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:12, fontWeight:700, color:'var(--text-muted)', letterSpacing:1, textTransform:'uppercase', marginBottom:6 }}>Nota (opcional)</div>
        <input value={note} onChange={e => setNote(e.target.value)} placeholder="Ej: extra picante, sin jalapeño..." style={{ width:'100%', padding:'10px 14px', borderRadius:'var(--radius-sm)', border:'1px solid var(--border)', background:'var(--bg2)', color:'var(--text)', fontSize:14, fontFamily:'Barlow,sans-serif', outline:'none' }} />
      </div>
      <div style={{ display:'flex', gap:8 }}>
        <button onClick={() => { setStep(0);setFormat(null);setRelleno(null);setProteina(null);setSize('normal');setToppings([]);setSalsas([]);setNote('');setDone(false); }} style={{ flex:1, padding:'12px', borderRadius:999, border:'2px solid var(--border)', background:'transparent', color:'var(--text-muted)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, fontSize:15, cursor:'pointer' }}>← Editar</button>
        <button onClick={addToCart} style={{ flex:2, padding:'12px', borderRadius:999, border:'none', background:'var(--orange)', color:'#fff', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
          🛒 Agregar {fmt(price)}
        </button>
      </div>
    </div>
  );

  return (
    <div style={{ paddingBottom:16 }}>
      <div style={{ display:'flex', gap:4, marginBottom:18 }}>
        {steps.map((s, i) => (
          <div key={s} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
            <div style={{ width:'100%', height:3, borderRadius:2, background: i <= step ? 'var(--orange)' : 'var(--border)', transition:'background .3s' }}></div>
            <span style={{ fontSize:9, fontWeight:700, letterSpacing:.5, color: i <= step ? 'var(--orange)' : 'var(--text-muted)' }}>{s.toUpperCase()}</span>
          </div>
        ))}
      </div>

      {step === 0 && (
        <div>
          <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:22, marginBottom:14, color:'var(--text)' }}>¿Burrito o Bowl?</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
            {['burrito','bowl'].map(f => (
              <button key={f} onClick={() => setFormat(f)} style={{ background: format===f?'var(--orange)':'var(--card)', border:`2px solid ${format===f?'var(--orange)':'var(--border)'}`, borderRadius:'var(--radius)', padding:'20px 16px', cursor:'pointer', transition:'all .2s', display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
                <span style={{ fontSize:30 }}>{f==='burrito'?'🌯':'🥣'}</span>
                <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:17, color: format===f?'#fff':'var(--text)', textTransform:'uppercase' }}>{f}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {step === 1 && (
        <div>
          <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:22, marginBottom:4, color:'var(--text)' }}>Relleno</div>
          <div style={{ fontSize:12, color:'var(--text-muted)', marginBottom:12 }}>Elige 1</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {BURRITO_DATA.rellenos.map(r => (
              <button key={r} onClick={() => setRelleno(r)} style={{ background: relleno===r?'rgba(242,100,25,0.1)':'var(--card)', border:`2px solid ${relleno===r?'var(--orange)':'var(--border)'}`, borderRadius:'var(--radius-sm)', padding:'12px 16px', textAlign:'left', cursor:'pointer', transition:'all .2s', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, fontSize:16, color: relleno===r?'var(--orange)':'var(--text)' }}>{r}</button>
            ))}
          </div>
        </div>
      )}

      {step === 2 && (
        <div>
          <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:22, marginBottom:4, color:'var(--text)' }}>Proteína</div>
          <div style={{ display:'flex', gap:8, margin:'8px 0 12px' }}>
            {['normal','xl'].map(s => (
              <button key={s} onClick={() => setSize(s)} style={{ flex:1, padding:'7px', borderRadius:999, border:`2px solid ${size===s?'var(--orange)':'var(--border)'}`, background: size===s?'rgba(242,100,25,0.1)':'var(--card)', color: size===s?'var(--orange)':'var(--text-muted)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:13, cursor:'pointer', textTransform:'uppercase', transition:'all .2s' }}>{s==='xl'?'XL':'Normal'}</button>
            ))}
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {BURRITO_DATA.proteinas.map(p => (
              <button key={p.name} onClick={() => setProteina(p)} style={{ background: proteina?.name===p.name?'rgba(242,100,25,0.1)':'var(--card)', border:`2px solid ${proteina?.name===p.name?'var(--orange)':'var(--border)'}`, borderRadius:'var(--radius-sm)', padding:'12px 16px', cursor:'pointer', transition:'all .2s', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, fontSize:16, color: proteina?.name===p.name?'var(--orange)':'var(--text)' }}>{p.name}</span>
                <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:17, color:'var(--yellow)' }}>{fmt(size==='normal'?p.normal:p.xl)}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {step === 3 && (
        <div>
          <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:22, marginBottom:4, color:'var(--text)' }}>Toppings</div>
          <div style={{ fontSize:12, color:'var(--text-muted)', marginBottom:12 }}>Hasta 5 — {toppings.length}/5</div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
            {BURRITO_DATA.toppings.map(t => {
              const sel = toppings.includes(t);
              const maxed = !sel && toppings.length >= 5;
              return <button key={t} onClick={() => toggleArr(toppings,setToppings,t,5)} style={{ padding:'7px 13px', borderRadius:999, border:`2px solid ${sel?'var(--orange)':'var(--border)'}`, background: sel?'var(--orange)':'var(--card)', color: sel?'#fff':maxed?'var(--border)':'var(--text)', fontWeight:600, fontSize:13, cursor: maxed?'not-allowed':'pointer', opacity: maxed?.35:1 }}>{t}</button>;
            })}
          </div>
        </div>
      )}

      {step === 4 && (
        <div>
          <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:22, marginBottom:4, color:'var(--text)' }}>Salsas</div>
          <div style={{ fontSize:12, color:'var(--text-muted)', marginBottom:12 }}>Hasta 2 — {salsas.length}/2</div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
            {BURRITO_DATA.salsas.map(s => {
              const sel = salsas.includes(s);
              const maxed = !sel && salsas.length >= 2;
              return <button key={s} onClick={() => toggleArr(salsas,setSalsas,s,2)} style={{ padding:'7px 13px', borderRadius:999, border:`2px solid ${sel?'var(--yellow)':'var(--border)'}`, background: sel?'rgba(255,214,0,0.12)':'var(--card)', color: sel?'#8a6800':maxed?'var(--border)':'var(--text)', fontWeight:600, fontSize:13, cursor: maxed?'not-allowed':'pointer', opacity: maxed?.35:1 }}>{s}</button>;
            })}
          </div>
        </div>
      )}

      <div style={{ display:'flex', gap:10, marginTop:20 }}>
        {step > 0
          ? <button onClick={() => setStep(s => s - 1)} style={{ flex:1, padding:'11px', borderRadius:999, border:'2px solid var(--border)', background:'transparent', color:'var(--text-muted)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, fontSize:15, cursor:'pointer' }}>← Atrás</button>
          : <div style={{ flex:1 }}></div>
        }
        <button disabled={!canNext[step]} onClick={() => { if (step < 4) setStep(s => s + 1); else setDone(true); }} style={{ flex:2, padding:'11px', borderRadius:999, border:'none', background: canNext[step]?'var(--orange)':'var(--border)', color: canNext[step]?'#fff':'var(--text-muted)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:17, cursor: canNext[step]?'pointer':'not-allowed', transition:'all .2s' }}>
          {step === 4 ? 'Revisar pedido →' : 'Siguiente →'}
        </button>
      </div>
    </div>
  );
}

// ─── CART DRAWER ─────────────────────────────────────────────────────────────
function CartDrawer() {
  const { items, updateQty, removeItem, clearCart, total, count, isOpen, setIsOpen } = useCart();

  const buildWAMsg = () => {
    const lines = ["Hola Gustoso's! Quiero hacer un pedido 🛒", ''];
    items.forEach((item, i) => {
      lines.push(`${i+1}. ${item.qty}x ${item.name}${item.size ? ` (${item.size.toUpperCase()})` : ''} — ${fmt(item.price * item.qty)}`);
      if (item.desc) lines.push(`   📋 ${item.desc}`);
      if (item.note) lines.push(`   📝 Nota: ${item.note}`);
    });
    lines.push('');
    lines.push(`💰 TOTAL: ${fmt(total)}`);
    return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(lines.join('\n'))}`;
  };

  if (!isOpen) return null;

  return (
    <div style={{ position:'fixed', inset:0, zIndex:600, display:'flex', flexDirection:'column', justifyContent:'flex-end', alignItems:'center' }}>
      <div onClick={() => setIsOpen(false)} style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.5)', backdropFilter:'blur(4px)' }}></div>
      <div style={{ position:'relative', zIndex:1, width:'100%', maxWidth:'var(--max)', background:'var(--card)', borderRadius:'var(--radius) var(--radius) 0 0', maxHeight:'85dvh', display:'flex', flexDirection:'column', animation:'slideUp .3s ease', boxShadow:'0 -8px 40px rgba(0,0,0,0.3)' }}>
        {/* Header */}
        <div style={{ padding:'16px 20px 12px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
          <div>
            <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:22, color:'var(--text)' }}>Tu pedido</div>
            <div style={{ fontSize:13, color:'var(--text-muted)' }}>{count} {count === 1 ? 'producto' : 'productos'}</div>
          </div>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            {items.length > 0 && <button onClick={clearCart} style={{ fontSize:12, color:'var(--text-muted)', background:'transparent', border:'1px solid var(--border)', borderRadius:999, padding:'4px 10px', cursor:'pointer', fontWeight:600 }}>Vaciar</button>}
            <button onClick={() => setIsOpen(false)} style={{ width:32, height:32, borderRadius:'50%', border:'none', background:'var(--bg2)', cursor:'pointer', fontSize:18, color:'var(--text-muted)', display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>
          </div>
        </div>

        {/* Items */}
        <div style={{ overflowY:'auto', flex:1, padding:'12px 20px' }}>
          {items.length === 0 ? (
            <div style={{ textAlign:'center', padding:'40px 0', color:'var(--text-muted)' }}>
              <div style={{ fontSize:40, marginBottom:12 }}>🛒</div>
              <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, fontSize:18 }}>Tu carrito está vacío</div>
              <div style={{ fontSize:13, marginTop:6 }}>Agrega productos desde el menú</div>
            </div>
          ) : (
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {items.map(item => (
                <div key={item.id} style={{ background:'var(--bg2)', borderRadius:'var(--radius-sm)', padding:'12px 14px', border:'1px solid var(--border)' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8, marginBottom:6 }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, fontSize:16, color:'var(--text)', lineHeight:1.2 }}>
                        {item.name}
                        {item.size && <span style={{ fontSize:12, color:'var(--orange)', fontWeight:900, marginLeft:6, background:'rgba(242,100,25,0.1)', padding:'1px 5px', borderRadius:4 }}>{item.size.toUpperCase()}</span>}
                      </div>
                      {item.desc && <div style={{ fontSize:12, color:'var(--text-muted)', marginTop:2, lineHeight:1.4 }}>{item.desc}</div>}
                      {item.note && <div style={{ fontSize:12, color:'var(--orange)', marginTop:3, fontStyle:'italic' }}>📝 {item.note}</div>}
                    </div>
                    <button onClick={() => removeItem(item.id)} style={{ color:'var(--text-muted)', background:'transparent', border:'none', cursor:'pointer', padding:4, flexShrink:0, opacity:.6 }}><TrashIcon size={14}/></button>
                  </div>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    <div style={{ display:'flex', alignItems:'center', border:'1px solid var(--border)', borderRadius:999, overflow:'hidden', background:'var(--card)' }}>
                      <button onClick={() => updateQty(item.id, -1)} style={{ width:32, height:32, border:'none', background:'transparent', cursor:'pointer', fontSize:16, color:'var(--text)', display:'flex', alignItems:'center', justifyContent:'center' }}>−</button>
                      <span style={{ padding:'0 10px', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:16, color:'var(--text)' }}>{item.qty}</span>
                      <button onClick={() => updateQty(item.id, 1)} style={{ width:32, height:32, border:'none', background:'transparent', cursor:'pointer', fontSize:16, color:'var(--orange)', display:'flex', alignItems:'center', justifyContent:'center' }}>+</button>
                    </div>
                    <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:18, color:'var(--yellow)' }}>{fmt(item.price * item.qty)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Footer */}
        {items.length > 0 && (
          <div style={{ padding:'16px 20px 32px', borderTop:'1px solid var(--border)', flexShrink:0 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
              <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, fontSize:16, color:'var(--text-muted)' }}>TOTAL</span>
              <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:28, color:'var(--text)' }}>{fmt(total)}</span>
            </div>
            <a href={buildWAMsg()} target="_blank" rel="noopener noreferrer" style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:10, background:'#25D366', color:'#fff', padding:'15px 24px', borderRadius:999, fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:20, letterSpacing:.5, textDecoration:'none', boxShadow:'0 4px 16px rgba(37,211,102,0.3)' }}>
              <WAIcon size={20} color="#fff"/> Enviar pedido por WhatsApp
            </a>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── CART BAR ────────────────────────────────────────────────────────────────
function CartBar() {
  const { count, total, setIsOpen } = useCart();
  const [popped, setPopped] = React.useState(false);
  const prevCount = React.useRef(0);

  React.useEffect(() => {
    if (count > prevCount.current) {
      setPopped(true);
      setTimeout(() => setPopped(false), 300);
    }
    prevCount.current = count;
  }, [count]);

  if (count === 0) return null;

  return (
    <div style={{ position:'fixed', bottom:0, left:0, right:0, zIndex:400, display:'flex', justifyContent:'center', padding:'12px 16px 20px', background:'linear-gradient(0deg, var(--bg) 60%, transparent)', pointerEvents:'none' }}>
      <button onClick={() => setIsOpen(true)} style={{ pointerEvents:'all', width:'100%', maxWidth:'var(--max)', padding:'14px 20px', borderRadius:999, border:'none', background:'var(--orange)', color:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer', boxShadow:'0 4px 20px rgba(242,100,25,0.4)', transform: popped ? 'scale(1.03)' : 'scale(1)', transition:'transform .15s' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ background:'rgba(255,255,255,0.25)', width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:15, transform: popped ? 'scale(1.3)' : 'scale(1)', transition:'transform .3s' }}>{count}</div>
          <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:18, letterSpacing:.5 }}>Ver pedido</span>
        </div>
        <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:18 }}>{fmt(total)}</span>
      </button>
    </div>
  );
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
function Nav({ scrolled }) {
  const { count, setIsOpen } = useCart();
  const scrollTo = id => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior:'smooth' }); };

  return (
    <nav style={{ position:'fixed', top:0, left:0, right:0, zIndex:100, background: scrolled?'rgba(255,249,245,0.95)':'transparent', backdropFilter: scrolled?'blur(12px)':'none', borderBottom: scrolled?'1px solid var(--border)':'none', transition:'all .35s', padding:'12px 20px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
      <Logo size={24}/>
      <div style={{ display:'flex', gap:6, alignItems:'center' }}>
        {[['menu','Menú'],['nosotros','Nosotros'],['contacto','Contacto']].map(([id,label]) => (
          <button key={id} onClick={() => scrollTo(id)} style={{ background:'transparent', border:'none', color:'var(--text-muted)', fontSize:13, fontWeight:600, cursor:'pointer', padding:'6px 8px', borderRadius:6, transition:'color .2s' }}
            onMouseEnter={e => e.target.style.color='var(--text)'}
            onMouseLeave={e => e.target.style.color='var(--text-muted)'}

        ))}
        <button onClick={() => setIsOpen(true)} style={{ position:'relative', background:'var(--orange)', color:'#fff', border:'none', borderRadius:999, padding:'7px 14px', display:'flex', alignItems:'center', gap:6, fontSize:13, fontWeight:700, cursor:'pointer' }}>
          🛒
          {count > 0 && <span style={{ position:'absolute', top:-6, right:-6, background:'var(--yellow)', color:'#1A0800', width:18, height:18, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:11 }}>{count}</span>}
        </button>
      </div>
    </nav>
  );
}

          </a>
        </div>
        <div style={{ display:'flex', gap:0, marginTop:48, border:'1px solid var(--border)', borderRadius:'var(--radius)', overflow:'hidden', background:'rgba(255,255,255,0.7)', backdropFilter:'blur(8px)' }}>
          {[['5+','Años'],['500+','Clientes felices'],['30min','Tiempo promedio']].map(([num, label], i) => (
            <div key={i} style={{ flex:1, padding:'16px 8px', textAlign:'center', borderRight: i<2?'1px solid var(--border)':'none' }}>
              <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:24, color:'var(--orange)' }}>{num}</div>
              <div style={{ fontSize:11, color:'var(--text-muted)', fontWeight:600 }}>{label}</div>
            </div>
          ))}
        </div>
      </div>

}

// ─── MENU SECTION ────────────────────────────────────────────────────────────
const TABS = [
  { id:'vienesas', label:'Vienesas',   emoji:'🌭' },
  { id:'as',       label:'AS',         emoji:'🥪' },
  { id:'churrasco',label:'Churrasco',  emoji:'🥩' },
  { id:'mechada',  label:'Mechada',    emoji:'🥖' },
  { id:'burrito',  label:'Burrito',    emoji:'🌯' },
  { id:'papas',    label:'Papas & Más',emoji:'🍟' },
];

function MenuSection() {
  const [activeTab, setActiveTab] = React.useState('vienesas');
  const tabBarRef = React.useRef(null);

  const switchTab = id => {
    setActiveTab(id);
    if (tabBarRef.current) {
      const btn = tabBarRef.current.querySelector(`[data-tab="${id}"]`);
      if (btn) tabBarRef.current.scrollLeft = btn.offsetLeft - tabBarRef.current.clientWidth / 2 + btn.offsetWidth / 2;
    }
  };

  const activeTabData = TABS.find(t => t.id === activeTab);
  const tabLabel = activeTab==='churrasco'?'Sándwich Churrasco':activeTab==='mechada'?'Sándwich Mechada':activeTab==='burrito'?'Burrito Gustoso':activeTab==='papas'?'Papas & Más':activeTabData?.label;

  const renderContent = () => {
    const listStyle = { display:'flex', flexDirection:'column', gap:10 };
    switch (activeTab) {
      case 'vienesas':   return <div style={listStyle}>{MENU_DATA.vienesas.items.map(i => <SimpleCard key={i.name} item={i}/>)}</div>;
      case 'as':         return <div style={listStyle}>{MENU_DATA.as.items.map(i => <SimpleCard key={i.name} item={i}/>)}</div>;
      case 'churrasco':  return <div><SizeHint/><div style={listStyle}>{MENU_DATA.churrasco.items.map(i => <DualCard key={i.name} item={i}/>)}</div></div>;
      case 'mechada':    return <div><SizeHint/><div style={listStyle}>{MENU_DATA.mechada.items.map(i => <DualCard key={i.name} item={i}/>)}</div></div>;
      case 'burrito':    return <BurritoBuilder/>;
      case 'papas':      return <div>{MENU_DATA.papas.groups.map(g => <div key={g.name}><SectionHeader title={g.name}/><div style={listStyle}>{g.items.map(i => <SimpleCard key={i.name} item={i}/>)}</div></div>)}</div>;
      default:           return null;
    }
  };

  return (
    <section id="menu" style={{ paddingBottom:100 }}>
      <div style={{ position:'sticky', top:52, zIndex:30, background:'rgba(255,249,245,0.96)', backdropFilter:'blur(12px)', borderBottom:'1px solid var(--border)', padding:'10px 20px' }}>
        <div ref={tabBarRef} style={{ display:'flex', gap:8, overflowX:'auto', scrollbarWidth:'none', msOverflowStyle:'none', paddingBottom:2 }}>
          {TABS.map(tab => (
            <button key={tab.id} data-tab={tab.id} onClick={() => switchTab(tab.id)} style={{ display:'flex', alignItems:'center', gap:5, padding:'7px 13px', borderRadius:999, border: activeTab===tab.id?'2px solid var(--orange)':'2px solid transparent', background: activeTab===tab.id?'var(--orange)':'var(--bg3)', color: activeTab===tab.id?'#fff':'var(--text-muted)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, fontSize:13, whiteSpace:'nowrap', cursor:'pointer', transition:'all .2s', letterSpacing:.5, flexShrink:0 }}>
              <span style={{ fontSize:13 }}>{tab.emoji}</span>{tab.label}
            </button>
          ))}
        </div>
      </div>
      <div style={{ maxWidth:'var(--max)', margin:'0 auto', padding:'20px 16px 0' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
          <span style={{ fontSize:24 }}>{activeTabData?.emoji}</span>
          <h2 style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:26, color:'var(--text)', letterSpacing:.3, lineHeight:1 }}>{tabLabel}</h2>
        </div>
        {activeTab === 'burrito' && <p style={{ fontSize:13, color:'var(--text-muted)', marginBottom:14, fontWeight:500 }}>Arma tu Burrito o Bowl personalizado paso a paso</p>}
        {renderContent()}
      </div>
    </section>
  );
}

function SizeHint() {
  return (
    <div style={{ display:'flex', gap:8, marginBottom:12, padding:'8px 12px', background:'var(--bg2)', borderRadius:'var(--radius-sm)', border:'1px solid var(--border)' }}>
      <span style={{ fontSize:12, fontWeight:600, color:'var(--text-muted)' }}>Toca <strong style={{ color:'var(--orange)' }}>+</strong> para elegir tamaño y agregar al carrito</span>
    </div>
  );
}

// ─── GALLERY ─────────────────────────────────────────────────────────────────
function Gallery() {
  const slots = ['Sándwich Churrasco','Burrito Gustoso','Salchipapas','Sándwich Mechada'];
  return (
    <section style={{ padding:'60px 0', background:'var(--bg2)' }}>
      <div style={{ maxWidth:'var(--max)', margin:'0 auto', padding:'0 20px' }}>
        <div style={{ textAlign:'center', marginBottom:28 }}>
          <span style={{ fontSize:11, fontWeight:700, letterSpacing:3, color:'var(--orange)', textTransform:'uppercase' }}>Galería</span>
          <h2 style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:32, color:'var(--text)', marginTop:6 }}>Nuestros platos</h2>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          {slots.map((s, i) => (
            <div key={i} style={{ aspectRatio:'4/3', background:'var(--bg3)', borderRadius:'var(--radius)', border:'1px dashed var(--border)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:6, overflow:'hidden', position:'relative' }}>
              <div style={{ position:'absolute', inset:0, backgroundImage:'repeating-linear-gradient(45deg,rgba(242,100,25,0.04) 0px,rgba(242,100,25,0.04) 1px,transparent 1px,transparent 10px)' }}></div>
              <div style={{ position:'relative', zIndex:1, textAlign:'center', padding:'0 10px' }}>
                <div style={{ fontSize:24, marginBottom:4 }}>📷</div>
                <div style={{ fontSize:11, fontWeight:700, color:'var(--text-muted)', letterSpacing:.5, fontFamily:'monospace' }}>{s}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ─── ABOUT ───────────────────────────────────────────────────────────────────
function About() {
  return (
    <section id="nosotros" style={{ padding:'60px 20px', maxWidth:'var(--max)', margin:'0 auto', textAlign:'center' }}>
      <span style={{ fontSize:11, fontWeight:700, letterSpacing:3, color:'var(--orange)', textTransform:'uppercase' }}>Quiénes somos</span>
      <h2 style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:36, color:'var(--text)', margin:'8px 0 18px', lineHeight:1 }}>La calidad <span style={{ color:'var(--orange)' }}>va en el gusto</span></h2>
      <p style={{ fontSize:16, color:'var(--text-muted)', lineHeight:1.7, maxWidth:460, margin:'0 auto 16px' }}>En Gustoso's creemos que comer rico no debería ser complicado. Desde nuestros jugosos sándwiches hasta nuestros burritos armados a tu gusto, cada pedido se prepara con ingredientes frescos y mucho cariño.</p>
      <p style={{ fontSize:16, color:'var(--text-muted)', lineHeight:1.7, maxWidth:460, margin:'0 auto' }}>Somos un local comprometido con entregar sabor real — sin atajos, sin ingredientes de relleno.</p>
    </section>
  );
}

// ─── REVIEWS ─────────────────────────────────────────────────────────────────
function Reviews() {
  const reviews = [
    { name:'Francisca M.', stars:5, text:'El sándwich mechada italiano queso es lo mejor que he probado. Siempre vuelvo.' },
    { name:'Rodrigo V.',    stars:5, text:'Pedí el burrito con carne y elegí mis toppings, llegó perfecto. Atención excelente.' },
    { name:'Carolina T.',   stars:5, text:'Las salchipapas son enormes para el precio. Muy buena relación calidad-precio.' },
    { name:'Sebastián P.',  stars:5, text:'Rapidísimos por WhatsApp, el pedido llegó completo y caliente. 100% recomendado.' },
  ];
  return (
    <section style={{ padding:'60px 0', background:'var(--bg2)' }}>
      <div style={{ maxWidth:'var(--max)', margin:'0 auto', padding:'0 20px' }}>
        <div style={{ textAlign:'center', marginBottom:28 }}>
          <span style={{ fontSize:11, fontWeight:700, letterSpacing:3, color:'var(--orange)', textTransform:'uppercase' }}>Testimonios</span>
          <h2 style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:32, color:'var(--text)', marginTop:6 }}>Lo que dicen nuestros clientes</h2>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          {reviews.map((r, i) => (
            <div key={i} style={{ background:'var(--card)', border:'1px solid var(--border)', borderRadius:'var(--radius)', padding:'16px' }}>
              <div className="stars" style={{ fontSize:13, marginBottom:8 }}>{'★'.repeat(r.stars)}</div>
              <p style={{ fontSize:13, color:'var(--text)', lineHeight:1.6, marginBottom:12, fontStyle:'italic' }}>"{r.text}"</p>
              <div style={{ fontSize:12, fontWeight:700, color:'var(--text-muted)' }}>{r.name}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ─── TIP SECTION ─────────────────────────────────────────────────────────────
function TipSection() {
  const [selected, setSelected] = React.useState(null);
  const [sent, setSent] = React.useState(false);
  const amounts = [500, 1000, 2000, 5000];

  const sendTip = () => {
    if (!selected) return;
    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(`Hola Gustoso's! Quiero dejar una propina de ${fmt(selected)} 🙏 ¿Cómo les transfiero?`)}`, '_blank');
    setSent(true);
  };

  return (
    <section style={{ padding:'60px 20px', maxWidth:'var(--max)', margin:'0 auto', textAlign:'center' }}>
      <span style={{ fontSize:11, fontWeight:700, letterSpacing:3, color:'var(--orange)', textTransform:'uppercase' }}>Propina</span>
      <h2 style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:32, color:'var(--text)', margin:'8px 0 8px' }}>¿Te gustó la atención?</h2>
      <p style={{ fontSize:14, color:'var(--text-muted)', marginBottom:24 }}>100% opcional, siempre agradecida.</p>
      {sent ? (
        <div style={{ background:'rgba(37,211,102,0.08)', border:'1px solid rgba(37,211,102,0.25)', borderRadius:'var(--radius)', padding:'24px' }}>
          <div style={{ fontSize:32, marginBottom:6 }}>🙏</div>
          <div style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:22, color:'#1a8a3e' }}>¡Muchas gracias!</div>
        </div>
      ) : (
        <div>
          <div style={{ display:'flex', gap:8, justifyContent:'center', marginBottom:18, flexWrap:'wrap' }}>
            {amounts.map(a => (
              <button key={a} onClick={() => setSelected(a)} style={{ padding:'10px 18px', borderRadius:999, border:`2px solid ${selected===a?'var(--orange)':'var(--border)'}`, background: selected===a?'rgba(242,100,25,0.1)':'var(--card)', color: selected===a?'var(--orange)':'var(--text)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:17, cursor:'pointer', transition:'all .2s' }}>{fmt(a)}</button>
            ))}
          </div>
          <button onClick={sendTip} disabled={!selected} style={{ display:'inline-flex', alignItems:'center', gap:8, background: selected?'#25D366':'var(--bg3)', color: selected?'#fff':'var(--text-muted)', padding:'13px 26px', borderRadius:999, border:'none', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:17, cursor: selected?'pointer':'not-allowed', transition:'all .2s' }}>
            <WAIcon size={17} color={selected?'#fff':'var(--text-muted)'}/> Enviar propina
          </button>
        </div>
      )}
    </section>
  );
}

// ─── CONTACT ─────────────────────────────────────────────────────────────────
function Contact() {
  const waUrl = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent("Hola Gustoso's, quiero hacer un pedido 🌭")}`;
  return (
    <section id="contacto" style={{ background:'var(--bg2)', padding:'60px 0 80px' }}>
      <div style={{ maxWidth:'var(--max)', margin:'0 auto', padding:'0 20px' }}>
        <div style={{ textAlign:'center', marginBottom:28 }}>
          <span style={{ fontSize:11, fontWeight:700, letterSpacing:3, color:'var(--orange)', textTransform:'uppercase' }}>Encuéntranos</span>
          <h2 style={{ fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:32, color:'var(--text)', marginTop:6 }}>Cómo llegar</h2>
        </div>
        <div style={{ width:'100%', height:200, background:'var(--bg3)', borderRadius:'var(--radius)', border:'1px solid var(--border)', marginBottom:16, overflow:'hidden' }}>
          <iframe title="Ubicación Gustoso's" src="https://maps.google.com/maps?q=Marino+Jose+Manuel+Ramirez+1641&output=embed&z=15" width="100%" height="100%" style={{ border:'none' }} loading="lazy"></iframe>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:10, marginBottom:20 }}>
          {[
            { icon:<LocationIcon size={17}/>, label:'Dirección', value:ADDRESS },
            { icon:<ClockIcon size={17}/>,   label:'Horario',   value:'Lunes a Domingo · 12:00 – 23:00' },
            { icon:<PhoneIcon size={17}/>,   label:'WhatsApp',  value:'+56 9 8521 0940', href:waUrl },
          ].map((item, i) => (
            <div key={i} style={{ background:'var(--card)', border:'1px solid var(--border)', borderRadius:'var(--radius-sm)', padding:'12px 16px', display:'flex', alignItems:'flex-start', gap:12 }}>
              <div style={{ color:'var(--orange)', flexShrink:0, marginTop:2 }}>{item.icon}</div>
              <div>
                <div style={{ fontSize:10, fontWeight:700, color:'var(--text-muted)', letterSpacing:1, textTransform:'uppercase', marginBottom:2 }}>{item.label}</div>
                {item.href
                  ? <a href={item.href} target="_blank" rel="noopener noreferrer" style={{ fontSize:14, fontWeight:600, color:'#25D366', textDecoration:'none' }}>{item.value}</a>
                  : <div style={{ fontSize:14, fontWeight:600, color:'var(--text)' }}>{item.value}</div>
                }
              </div>
            </div>
          ))}
        </div>
        <a href={waUrl} target="_blank" rel="noopener noreferrer" style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:10, background:'#25D366', color:'#fff', padding:'15px 24px', borderRadius:999, fontFamily:"'Barlow Condensed',sans-serif", fontWeight:900, fontSize:19, letterSpacing:.5, textDecoration:'none', boxShadow:'0 6px 20px rgba(37,211,102,0.25)' }}>
          <WAIcon size={20} color="#fff"/> Hacer pedido ahora
        </a>
      </div>
    </section>
  );
}

// ─── FOOTER ──────────────────────────────────────────────────────────────────
function Footer() {
  return (
    <footer style={{ background:'var(--bg)', borderTop:'1px solid var(--border)', padding:'24px 20px', textAlign:'center' }}>
      <div style={{ display:'flex', justifyContent:'center', marginBottom:10 }}><Logo size={22}/></div>
      <div style={{ fontSize:13, color:'var(--text-muted)', marginBottom:4 }}>{ADDRESS}</div>
      <div style={{ fontSize:12, color:'rgba(160,84,26,0.4)' }}>© 2026 Gustoso's — La Calidad Va en el Gusto</div>
    </footer>
  );
}

// ─── FLOATING WA ─────────────────────────────────────────────────────────────
function FloatingWA() {
  const { count } = useCart();
  if (count > 0) return null;
  const waUrl = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent("Hola Gustoso's, quiero hacer un pedido 🌭")}`;
  return (
    <a href={waUrl} target="_blank" rel="noopener noreferrer" style={{ position:'fixed', bottom:24, right:20, zIndex:200, width:54, height:54, borderRadius:'50%', background:'#25D366', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 18px rgba(37,211,102,0.5)', textDecoration:'none' }}>
      <div style={{ position:'absolute', width:'100%', height:'100%', borderRadius:'50%', background:'rgba(37,211,102,0.35)', animation:'pulse-ring 2s ease-out infinite' }}></div>
      <WAIcon size={26} color="#fff"/>
    </a>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [scrolled, setScrolled] = React.useState(false);

  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', onScroll, { passive:true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <CartProvider>
      <div style={{ maxWidth:'var(--max)', margin:'0 auto', position:'relative' }}>
        <Nav scrolled={scrolled}/>
        <Hero/>
        <div className="section-divider"></div>
        <MenuSection/>
        <div className="section-divider"></div>
        <Gallery/>
        <div className="section-divider"></div>
        <About/>
        <div className="section-divider"></div>
        <Reviews/>
        <div className="section-divider"></div>
        <TipSection/>
        <div className="section-divider"></div>
        <Contact/>
        <Footer/>
        <FloatingWA/>
        <CartBar/>
        <CartDrawer/>
      </div>
    </CartProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
